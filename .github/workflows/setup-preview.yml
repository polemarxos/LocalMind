name: Setup preview

# Screenshots of the first-start window ("Welcome! Download the recommended models…") as it looks on
# NVIDIA and AMD PCs with 8 GB and 16 GB graphics cards (pretend hardware through LOCALMIND_FAKE_GPU).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/LocalMind/LocalMind.vbproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish
      - name: Screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:LOCALMIND_NOSPLASH = '1'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png")
            $g.Dispose(); $bmp.Dispose()
          }
          foreach ($run in @('nvidia:16:32|std', 'nvidia:16:32|unc', 'amd:16:32|std', 'amd:16:32|unc', 'nvidia:8:32|std', 'nvidia:8:32|unc', 'amd:8:32|std', 'amd:8:32|unc')) {
            $pc, $content = $run.Split('|')
            Remove-Item -Recurse -Force publish/Data, publish/Models -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force publish/Data | Out-Null
            @{ FeaturesAsked = $true; FirstRunDone = $true; EnableImages = $true; EnableAudio = $true;
               CheckForUpdates = $false; AutoUpdateEngines = $false; Language = 'en'; UncensoredContent = ($content -eq 'unc') } |
              ConvertTo-Json | Set-Content -Encoding utf8 publish/Data/settings.json
            $env:LOCALMIND_FAKE_GPU = $pc
            $env:LOCALMIND_PREVIEW = 'welcome'
            $p = Start-Process publish/LocalMind.exe -PassThru
            Start-Sleep -Seconds 35
            Shot ("welcome-" + ($pc -replace ":", "-") + "-" + $content)
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-preview
          path: shots/
