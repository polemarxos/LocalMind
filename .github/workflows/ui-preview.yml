name: UI preview

# Builds the app, starts it on a Windows runner and saves screenshots (English and Greek)
# as an artifact, so the look can be checked without a Windows PC.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/LocalMind/LocalMind.vbproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish
      - name: Screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png")
            $g.Dispose(); $bmp.Dispose()
          }
          foreach ($case in @('en', 'el', 'en-model')) {
            $lang = $case.Substring(0, 2)
            Remove-Item -Recurse -Force publish/Data, publish/Models -ErrorAction SilentlyContinue
            if ($case -eq 'en-model') {
              # a stand-in model file, so the "ready" welcome screen shows
              New-Item -ItemType Directory -Force publish/Models | Out-Null
              Set-Content publish/Models/Qwen3-8B-Q4_K_M.gguf 'x'
            }
            New-Item -ItemType Directory -Force publish/Data | Out-Null
            @{ FeaturesAsked = $true; FirstRunDone = $true; EnableImages = $true; EnableAudio = $true;
               CheckForUpdates = $false; AutoUpdateEngines = $false; Language = $lang } |
              ConvertTo-Json | Set-Content -Encoding utf8 publish/Data/settings.json
            $p = Start-Process publish/LocalMind.exe -PassThru
            Start-Sleep -Seconds 25
            Shot "main-$case"
            if ($case -eq 'en-model') {
              # Model Manager, with an Ollama-style search
              $ws = New-Object -ComObject WScript.Shell
              $null = $ws.AppActivate($p.Id); Start-Sleep 1
              $ws.SendKeys('^m'); Start-Sleep -Seconds 12
              Shot "models-best"
              $ws.SendKeys('Qwen3.8-27B-Uncensored:iq4_xs'); Start-Sleep -Seconds 4
              Shot "models-search"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
              $env:LOCALMIND_MODELS_TAB = 'media'
              $p = Start-Process publish/LocalMind.exe -PassThru
              Start-Sleep -Seconds 20
              $null = $ws.AppActivate($p.Id); Start-Sleep 1
              $ws.SendKeys('^m'); Start-Sleep -Seconds 15
              Shot "models-media"
              $env:LOCALMIND_MODELS_TAB = ''
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
              # the Studio and the Cast window
              New-Item -ItemType Directory -Force publish/Data/Cast | Out-Null
              '[{"Id":"a1","Kind":"character","Name":"Anna","Description":"woman in her 30s, short red hair, green eyes, leather jacket","Images":[]},{"Id":"b2","Kind":"character","Name":"Max","Description":"tall detective, grey beard, brown trench coat","Images":[]},{"Id":"c3","Kind":"location","Name":"Old harbor","Description":"foggy harbor at dawn, wooden boats, warm street lamps","Images":[]}]' | Set-Content -Encoding utf8 publish/Data/Cast/cast.json
              foreach ($pv in @('studio', 'cast')) {
                $env:LOCALMIND_PREVIEW = $pv
                $p = Start-Process publish/LocalMind.exe -PassThru
                Start-Sleep -Seconds 25
                Shot "window-$pv"
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
              }
              $env:LOCALMIND_PREVIEW = ''

            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: shots/
