name: Looks preview

# Starts the app once per look (Settings → Appearance) on a Windows runner and saves a screenshot of the main
# window and of the Model Manager for each, plus the loading screen, as an artifact.
on:
  workflow_dispatch:
    inputs:
      looks:
        description: 'Which looks (e.g. 1-30 or 3,7,12)'
        required: false
        default: '1-30'

permissions:
  contents: read

jobs:
  looks:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/LocalMind/LocalMind.vbproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish
      - name: Screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png")
            $g.Dispose(); $bmp.Dispose()
          }
          $spec = '${{ github.event.inputs.looks }}'
          if (-not $spec) { $spec = '1-30' }
          $list = @()
          foreach ($part in $spec.Split(',')) {
            if ($part -match '^(\d+)-(\d+)$') { $list += [int]$matches[1]..[int]$matches[2] } else { $list += [int]$part }
          }
          Remove-Item -Recurse -Force publish/Data, publish/Models -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force publish/Models | Out-Null
          Set-Content publish/Models/Qwen3-8B-Q4_K_M.gguf 'x'
          New-Item -ItemType Directory -Force publish/Data | Out-Null
          @{ FeaturesAsked = $true; FirstRunDone = $true; EnableImages = $true; EnableAudio = $true;
             CheckForUpdates = $false; AutoUpdateEngines = $false; Language = 'en' } |
            ConvertTo-Json | Set-Content -Encoding utf8 publish/Data/settings.json
          # the loading screen (look 1)
          $env:LOCALMIND_THEME = "$($list[0])"
          $p = Start-Process publish/LocalMind.exe -PassThru
          Start-Sleep -Seconds 4
          Shot "splash"
          Start-Sleep -Seconds 40
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          $env:LOCALMIND_NOSPLASH = '1'
          foreach ($n in $list) {
            $env:LOCALMIND_THEME = "$n"
            $p = Start-Process publish/LocalMind.exe -PassThru
            Start-Sleep -Seconds 18
            Shot ("look{0:D2}-main" -f $n)
            $ws = New-Object -ComObject WScript.Shell
            $null = $ws.AppActivate($p.Id); Start-Sleep 1
            $ws.SendKeys('^m'); Start-Sleep -Seconds 10
            Shot ("look{0:D2}-models" -f $n)
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: looks
          path: shots
