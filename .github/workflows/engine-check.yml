name: Engine check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List executables in the newest llama.cpp Windows builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=5' > rel.json
          for pat in 'bin-win-cuda-12[0-9.]*-x64.zip' 'bin-win-cuda-13[0-9.]*-x64.zip' 'bin-win-vulkan-x64.zip' 'bin-win-cpu-x64.zip'; do
            url=$(jq -r --arg p "^llama-.+-$pat\$" '[.[]|select(.draft|not)|.assets[]|select(.name|test($p))][0].browser_download_url' rel.json)
            echo "=== $url"
            curl -sL "$url" -o a.zip && unzip -Z1 a.zip | grep -i '\.exe$' | sort | tr '\n' ' '; echo
          done
          jq -r '.[]|.tag_name' rel.json
