name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: dotnet publish src/LocalMind/LocalMind.vbproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: LocalMind-win-x64
          path: publish/LocalMind.exe

      # Push a tag like v2.0.0 to publish a GitHub Release with the exe attached.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/LocalMind.exe -DestinationPath LocalMind-win-x64.zip
          gh release create "${{ github.ref_name }}" LocalMind-win-x64.zip --title "LocalMind ${{ github.ref_name }}" --generate-notes
