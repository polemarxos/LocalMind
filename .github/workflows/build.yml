name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. v2.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Quick tests: real chat messages and the steps they must give (tests/prompts.json), and engine version rollback.
      # A failure stops the build, so nothing is released.
      - name: Quick tests
        run: dotnet run --project tests/LocalMind.Harness -- prompts

      - name: Publish single-file exe
        run: dotnet publish src/LocalMind/LocalMind.vbproj -c Release -r win-x64 -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: LocalMind-win-x64
          path: publish/LocalMind.exe

      # Publish a GitHub Release with the exe attached, either by pushing a tag like v2.0.0
      # or from the Actions tab: Build → Run workflow → enter a version.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          Compress-Archive -Path publish/LocalMind.exe -DestinationPath LocalMind-win-x64.zip
          [Console]::OutputEncoding = [Text.Encoding]::UTF8   # the notes contain emoji
          python -X utf8 tools/release_notes.py "$env:VERSION" | Out-File -Encoding utf8 notes.md
          gh release view "$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            # Same version built again (e.g. a fix): replace the download and the notes.
            gh release upload "$env:VERSION" LocalMind-win-x64.zip --clobber
            gh release edit "$env:VERSION" --notes-file notes.md
          } else {
            gh release create "$env:VERSION" LocalMind-win-x64.zip --target "${{ github.sha }}" --title "LocalMind $env:VERSION" --notes-file notes.md --latest
          }
